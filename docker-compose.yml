# AutoCoach Agent Worker Deployment Stack
# Connects outbound to LiveKit Cloud (no local SFU or inbound media ports required)

services:
  autocoach-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autocoach-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - HEALTH_CHECK_HOST=0.0.0.0
      - HEALTH_CHECK_PORT=${HEALTH_CHECK_PORT:-8085}
    ports:
      # Bound to localhost on port 8085 to avoid conflicts with ports 8081-8083 on the host
      - "127.0.0.1:${HEALTH_CHECK_PORT:-8085}:${HEALTH_CHECK_PORT:-8085}"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request, os; port = os.getenv('HEALTH_CHECK_PORT', '8085'); urllib.request.urlopen(f'http://127.0.0.1:{port}/').read()\" || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
