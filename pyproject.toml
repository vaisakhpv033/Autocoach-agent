[project]
name = "autocoach"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Vaisakh P V", email = "vaisakhpv033@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.10.0",
    "google-genai>=2.10.0",
    "livekit-agents>=1.8.0",
    "livekit-plugins-google>=1.8.5",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["uv_build>=0.9.13,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
